appointment_facilitator.settings:
  type: config_object
  label: 'Appointment Facilitator settings'
  mapping:
    ask_on_slack_channels:
      type: sequence
      label: 'Slack channels (no #) where tool pages offer Ask on Slack; empty = nowhere'
      sequence:
        type: string
    show_always_join_cta:
      type: boolean
      label: 'Always show Join CTA even when effective capacity is 1'
    system_wide_joiner_cap:
      type: integer
      label: 'System-wide Joiner Cap'
    badges_vocab_machine_name:
      type: string
      label: 'Badges vocabulary machine name'
    facilitator_profile_bundle:
      type: string
      label: 'Facilitator profile bundle machine name'
    arrival_grace_minutes:
      type: integer
      label: 'Grace minutes for on-time arrival'
    arrival_pre_window_minutes:
      type: integer
      label: 'Minutes before start to match access scans'
    arrival_backfill_days:
      type: integer
      label: 'Days to backfill arrival status on cron'
    pending_badge_reminder_enabled:
      type: boolean
      label: 'Email facilitators about badges still pending after their appointment'
    pending_badge_reminder_after_hours:
      type: integer
      label: 'Hours after an appointment ends before the facilitator is reminded'
    pending_badge_reminder_window_days:
      type: integer
      label: 'Days back the pending-badge reminder looks'
    pending_badge_reminder_hour:
      type: integer
      label: 'Site-time hour from which the daily pending-badge reminder may send'
    pending_badge_reminder_base_url:
      type: string
      label: 'Site address used in pending-badge reminder links (empty = the request address)'
